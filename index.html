<title>Budget de M'ziza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one column. Debt hero (ring gauge + remaining amount) always on top, then four tab buttons
   (Dettes, Charges fixes, Budget quotidien, Entrées d'argent). Budget quotidien = quick add (text / receipt),
   donut of the monthly split, one fill gauge per category. Everything in soft greens. */
:root{
  --bg:#EDF3EE; --surface:#FBFDFB; --surface-2:#F0F6F1; --ink:#1E3A2F; --muted:#5B7566; --line:#D6E4DA;
  --accent:#357F60; --accent-ink:#FFFFFF; --accent-soft:#DAEDE1;
  --warn:#7F6420; --warn-soft:#F2EACB; --bad:#A8483F; --bad-soft:#F5DDD9; --track:#DCE9DF; --scrim:rgba(24,48,38,.45);
  --shadow:0 1px 2px rgba(30,58,47,.05),0 10px 26px -14px rgba(30,58,47,.16);
  --c1:#2E7556; --c2:#E3A92F; --c3:#3F86C4; --c4:#D9694F; --c5:#8A68B4; --c6:#7CC27F;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B15; --surface:#16251D; --surface-2:#1B2D23; --ink:#E2EEE6; --muted:#8FAA9B; --line:#29423A;
    --accent:#5CC59A; --accent-ink:#082418; --accent-soft:#1F3D31;
    --warn:#D9BB63; --warn-soft:#322E19; --bad:#E58B80; --bad-soft:#3D2521; --track:#27402F; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --c1:#5CC59A; --c2:#F0C560; --c3:#6FB0E6; --c4:#EE8A72; --c5:#B79AE0; --c6:#9ADB9D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B15; --surface:#16251D; --surface-2:#1B2D23; --ink:#E2EEE6; --muted:#8FAA9B; --line:#29423A;
  --accent:#5CC59A; --accent-ink:#082418; --accent-soft:#1F3D31;
  --warn:#D9BB63; --warn-soft:#322E19; --bad:#E58B80; --bad-soft:#3D2521; --track:#27402F; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c1:#5CC59A; --c2:#F0C560; --c3:#6FB0E6; --c4:#EE8A72; --c5:#B79AE0; --c6:#9ADB9D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);padding-inline:16px;padding-block:22px 64px;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p,dl,dd,dt{margin:0}

header.top{display:flex;flex-direction:column;gap:2px}
header.top h1{font:700 clamp(24px,5vw,32px)/1.1 var(--font-display);letter-spacing:-0.02em;text-wrap:balance}
header.top p{color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.hero{display:flex;gap:28px;align-items:center;padding:24px;flex-wrap:wrap;background:linear-gradient(160deg,var(--surface) 45%,var(--accent-soft) 190%)}
.hero-gauge{flex:0 0 auto;width:168px;max-width:100%}
.ring{display:block;width:100%;height:auto}
.ring .trk{fill:none;stroke:var(--track);stroke-width:14}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round}
.ring.play .bar{animation:ringfill 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
.ring .pct{font:700 30px var(--font-display);fill:var(--ink);text-anchor:middle}
.ring .sub{font:500 11px var(--font-body);fill:var(--muted);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase}
.hero-main{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font:700 clamp(44px,11vw,68px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.pair{display:flex;gap:10px 26px;flex-wrap:wrap}
.pair dt{font-size:12.5px;color:var(--muted)}
.pair dd{font:600 22px var(--font-display);font-variant-numeric:tabular-nums}
.eta{color:var(--muted);font-size:14px;max-width:60ch}

.chart-card{padding:20px}
.chart-card h2{font:600 17px var(--font-display);margin-bottom:2px}
.chart-card .hint{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11.5px var(--font-body)}
.chart .al{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .aa{fill:var(--accent);opacity:.14}
.chart .pl{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.chart .dot-end{fill:var(--surface);stroke:var(--muted);stroke-width:2.5}
.chart .lbl{fill:var(--ink);font:700 13px var(--font-display)}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px;border-radius:2px}
.endleg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.endleg h3{font:600 14px var(--font-display);color:var(--muted)}
.endleg>div{display:flex;align-items:center;gap:10px}
.endleg .dot{flex:0 0 auto;width:14px;height:14px;border-radius:50%}
.endleg .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.endleg .when{font:600 14px var(--font-display);text-transform:capitalize;white-space:nowrap}
.legend i.dash{border-top:3px dotted var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tab{--tc:var(--accent);--tcs:var(--accent-soft);display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:10px 12px 10px;border:2px solid var(--tc);border-radius:16px;background:var(--tcs);box-shadow:0 1px 2px rgba(30,58,47,.06);cursor:pointer;min-width:0;transition:transform .12s,box-shadow .12s;color:var(--ink)}
.tab .ic{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--tc);color:#fff}
.tab .ic svg{width:19px;height:19px}
.tab .t{font:800 17px/1.15 var(--font-display);overflow-wrap:anywhere;color:var(--ink)}
.tab .s{font:500 12.5px var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tab:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px var(--tc)}
.tab:active{transform:scale(.98)}
.tab[aria-selected="true"]{background:var(--tc);border-color:var(--tc);box-shadow:0 12px 22px -12px var(--tc)}
.tab[aria-selected="true"] .t,.tab[aria-selected="true"] .s{color:#fff}
.tab[aria-selected="true"] .s{opacity:.9}
.tab[aria-selected="true"] .ic{background:rgba(255,255,255,.22)}
.tab-debts{--tc:var(--t1);--tcs:var(--t1s)}.tab-fixed{--tc:var(--t2);--tcs:var(--t2s)}.tab-daily{--tc:var(--t3);--tcs:var(--t3s)}.tab-income{--tc:var(--t4);--tcs:var(--t4s)}
:root{--t1:#62B684;--t1s:#D4EFDF;--t2:#3E9E6A;--t2s:#B6E3C9;--t3:#238050;--t3s:#92D2AF;--t4:#0C5535;--t4s:#6DBF93}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t1:#8FD3AA;--t1s:#22392C;--t2:#6CC594;--t2s:#1F3A2C;--t3:#4FB07E;--t3s:#1D3B2E;--t4:#37996B;--t4s:#1B3C2F}}
:root[data-theme="dark"]{--t1:#8FD3AA;--t1s:#22392C;--t2:#6CC594;--t2s:#1F3A2C;--t3:#4FB07E;--t3s:#1D3B2E;--t4:#37996B;--t4s:#1B3C2F}
@media (max-width:640px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}

.panel{display:flex;flex-direction:column;gap:18px}
.monthnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monthnav .label{font:600 20px var(--font-display);text-transform:capitalize;min-width:9ch;text-align:center}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.cell{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .k{font-size:12.5px;color:var(--muted)}
.cell .v{font:700 24px var(--font-display);font-variant-numeric:tabular-nums}
.cell .s{font-size:12.5px;color:var(--muted)}
.cell .v.neg{color:var(--bad)}

.sec{overflow:hidden}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;flex-wrap:wrap}
.sec-head h3{font:600 17px var(--font-display)}
.sec-head .tot{color:var(--muted);font-size:13.5px}
.sec-head .left{display:flex;flex-direction:column;gap:3px;min-width:0}
.tag{display:inline-block;align-self:flex-start;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent)}
.sec.fixed{border-left:5px solid var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name amts" "meter meter" "acts acts";gap:8px 14px;padding:13px 16px;border-top:1px solid var(--line);align-items:center}
.row .name{grid-area:name;min-width:0}
.row .name b{font-weight:600;overflow-wrap:anywhere}
.row .name small{display:block;color:var(--muted);font-size:12.5px}
.row .amts{grid-area:amts;text-align:right;white-space:nowrap}
.row .amts .real{font:700 17px var(--font-display);font-variant-numeric:tabular-nums}
.row .amts .of{color:var(--muted);font-size:12.5px}
.row .meter{grid-area:meter}
.row .acts{grid-area:acts;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (min-width:660px){
  .row{grid-template-columns:minmax(0,1.5fr) minmax(150px,auto) auto;grid-template-areas:"name amts acts" "meter meter meter"}
  .row .acts{justify-content:flex-end}
}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.bad i{background:var(--bad)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.empty-row{padding:14px 16px;color:var(--muted);border-top:1px solid var(--line);font-size:14px}

details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.more{border-top:1px solid var(--line)}
.more>summary{padding:12px 16px;color:var(--muted);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.more>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto}
.more[open]>summary::before{transform:rotate(45deg)}

.qa{padding:18px;display:flex;flex-direction:column;gap:12px}
.qa h2{font:600 17px var(--font-display)}
.qa .hint{color:var(--muted);font-size:13.5px}
.qa form{display:flex;gap:8px;flex-wrap:wrap}
.qa input[type="text"]{flex:1 1 220px;min-width:0;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);font-size:17px}
.qa input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:1px}
.qa .scan{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.dcard{padding:20px;display:flex;flex-direction:column;gap:12px}
.dcard h2{font:600 17px var(--font-display)}
.dcard .hint{color:var(--muted);font-size:13.5px}
.dwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut{flex:0 0 auto;width:200px;max-width:100%}
.donut svg{display:block;width:100%;height:auto}
.donut .sl{stroke:var(--surface);stroke-width:2.5}
.donut .ctr{font:700 24px var(--font-display);fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.donut .cts{font:500 11px var(--font-body);fill:var(--muted);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase}
.dleg{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:8px}
.dleg div{display:flex;align-items:center;gap:10px}
.dleg .dot,.crow .dot{flex:0 0 auto;width:12px;height:12px;border-radius:4px}
.dleg .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.dleg .am{font:600 15px var(--font-display);font-variant-numeric:tabular-nums}
.dleg .sh{color:var(--muted);font-size:12.5px;min-width:3.6ch;text-align:right;font-variant-numeric:tabular-nums}
.dnote{font-size:13.5px;color:var(--muted)}
.dnote.bad{color:var(--bad)}

.crow{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.crow:first-child{border-top:0}
.chead{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.chead .l{display:flex;align-items:center;gap:10px;min-width:0}
.chead b{font-weight:600;overflow-wrap:anywhere}
.chead small.n{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.camt{font:700 17px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.camt small{font:500 12.5px var(--font-body);color:var(--muted)}
.cbar{height:12px;border-radius:7px;background:var(--track);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:7px;background:var(--accent)}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cleft{font-size:13.5px;color:var(--muted)}
.cleft b{color:var(--ink);font-weight:600}
.cleft.bad,.cleft.bad b{color:var(--bad)}
.cfoot .acts{display:flex;gap:8px}


.ask{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 8px;margin:-6px 0 -8px}
.ask form{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.ask form:focus-within{border-color:var(--accent)}
.ask .spark{flex:0 0 auto;width:18px;height:18px;color:var(--accent)}
.ask input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:8px 0;outline:none}
.ask .btn{padding:9px 14px;border-radius:12px}
.ask .mic{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.ask .mic svg{width:20px;height:20px}
.ask .mic.on{background:var(--accent);color:var(--accent-ink);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--accent-soft)}}
@media (prefers-reduced-motion: reduce){.ask .mic.on{animation:none}}
.sim{padding:4px 16px}
.sim{padding:0;border:0;box-shadow:none;background:transparent;margin-top:-10px}
.sim summary{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font:500 12.5px var(--font-body);color:var(--muted);border-radius:999px}
.sim summary:hover{background:var(--accent-soft)}
.sim summary svg{width:14px;height:14px;flex:0 0 auto}
.sim[open] summary,.sim details[open] summary{background:var(--accent-soft)}
.sim .histlist{padding:8px 0 4px}
.histlist{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.sit.undone{opacity:.6}
.sit-q small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.sim h2{font:700 18px var(--font-display);color:var(--warn)}
.sim .lead{font-size:13.5px;color:var(--muted)}
.sit{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.sit-top{display:flex;gap:10px;align-items:flex-start}
.sit .num{flex:0 0 auto;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--warn);color:var(--surface);font:700 13px var(--font-display)}
.sit-q{font-weight:600;overflow-wrap:anywhere}
.sit ul{margin:0;padding-left:22px;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.sit ul li.miss{color:var(--muted);font-style:italic}
.sit-acts{display:flex;gap:8px;flex-wrap:wrap}
.impact{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:var(--accent-soft)}
.impact h3{font:600 14px var(--font-display)}
.impact div{display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.impact .v{font:700 14px var(--font-display);font-variant-numeric:tabular-nums}
.impact .v.up{color:var(--accent)}.impact .v.down{color:var(--bad)}
.sim-foot{display:flex;gap:8px;flex-wrap:wrap}
.inst{padding:4px 16px}
.inst summary{padding:12px 0;font-weight:600;color:var(--muted);font-size:14px}
.inst ol{margin:0 0 12px;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
.inst b{color:var(--ink)}
.ans{padding:18px;display:flex;flex-direction:column;gap:10px}
.ans .q{font-size:13px;color:var(--muted)}
.ans .a p{margin:0 0 9px}
.ans .a p:last-child{margin-bottom:0}
.ans .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ans .tiny{font-size:12.5px;color:var(--muted)}

.cats{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"chk name num" ". bar bar";gap:7px 12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .chk{grid-area:chk;display:flex}
.crow .chk input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;margin:0}
.crow .cname{grid-area:name;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;font-weight:600;font-size:15px}
.crow .cname span.t{overflow-wrap:anywhere;text-decoration:underline dotted var(--line);text-underline-offset:4px}
.crow .cbar{grid-area:bar}
.crow .off-txt{grid-area:bar;color:var(--muted);font-size:13px}
.crow .cnum{grid-area:num;text-align:right;display:flex;flex-direction:column;line-height:1.2}
.crow .cnum b{font:700 17px var(--font-display);font-variant-numeric:tabular-nums}
.crow .cnum b.big{font-size:23px;font-weight:800;color:var(--accent)}
.crow .cnum b.big.bad{color:var(--bad)}
.crow .cnum small{font-size:12px;color:var(--muted)}
.crow .cnum small.bad{color:var(--bad)}
.crow.off .cname,.crow.off .cnum b{color:var(--muted);font-weight:500}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.frow .name{min-width:0}

<div class="wrap" id="app" aria-live="polite"></div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var nf0 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var nf2 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
var round2 = function(n){ return Math.round((+n||0)*100)/100; };
var eur = function(n){ n = round2(n); return Number.isInteger(n) ? nf0.format(n) : nf2.format(n); };
var pad = function(n){ return String(n).padStart(2,'0'); };
var todayISO = function(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var addDays = function(iso,k){ var d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+k); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var monthOf = function(iso){ return String(iso||'').slice(0,7); };
var addMonths = function(m,k){ var p = m.split('-').map(Number); var d = new Date(p[0], p[1]-1+k, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
var monthLabel = function(m){ var p = m.split('-').map(Number); return new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); };
var monthShort = function(m){ var p = m.split('-').map(Number); return new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}); };
var dateLabel = function(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); };
var uid = function(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g,'').slice(0,10) : Math.random().toString(36).slice(2,12); };
var parseAmt = function(s){ var v = parseFloat(String(s==null?'':s).replace(/\s/g,'').replace(',','.')); return isFinite(v) ? v : NaN; };
var fmtIn = function(n){ return String(round2(n)).replace('.',','); };
var sum = function(a, f){ return a.reduce(function(s,x){ return s + (f ? f(x) : x); }, 0); };
var maxStr = function(a){ return a.reduce(function(x,y){ return x > y ? x : y; }); };
var norm = function(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); };

/* ---------- state ---------- */
var S = {
  ready:false, mode:'db', cfg:{items:[],debts:[],startDate:todayISO()}, tx:[],
  month: monthOf(todayISO()), tab:null, hist:[], askQ:'', askOut:'', askBusy:false, askCtl:null, askAsked:'', confirm:null, played:false, open:{}, qa:'',
  m:null, i:null, sk:null, gotCfg:false, gotTx:false, sample:null, canScan:false, undo:null, scanCtl:null
};
var db = null;
var LS_KEY = 'budget-mziza-v2';

function normCfg(d){
  var c = JSON.parse(JSON.stringify(d || {}));
  c.items = Array.isArray(c.items) ? c.items : [];
  c.debts = Array.isArray(c.debts) ? c.debts : [];
  c.startDate = c.startDate || todayISO();
  return c;
}

/* ---------- persistence ---------- */
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({cfg:S.cfg, tx:S.tx})); } catch(e){} }
function loadLocal(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) { var o = JSON.parse(raw); S.cfg = normCfg(o.cfg); S.tx = Array.isArray(o.tx) ? o.tx : []; }
  } catch(e){}
}
var cfgPending = 0, cfgChain = Promise.resolve();
function writeFailed(){ toast("La modification n'a pas pu être enregistrée. Vérifiez la connexion ou vos droits de modification."); }
function persistCfg(){
  if (!db) { saveLocal(); return; }
  var snap = JSON.parse(JSON.stringify(S.cfg));
  cfgPending++;
  cfgChain = cfgChain.then(function(){ return db.doc('app/config').set(snap); })
    .catch(writeFailed)
    .then(function(){ cfgPending--; });
}
function persistTx(t){
  if (!db) { saveLocal(); return; }
  db.collection('tx').doc(t.id).set({date:t.date,kind:t.kind,ref:t.ref,label:t.label,amount:t.amount,note:t.note||''}).catch(writeFailed);
}
function removeTx(id){
  if (!db) { saveLocal(); return; }
  db.collection('tx').doc(id).delete().catch(writeFailed);
}
function startDb(handle){
  db = handle; S.mode = 'db';
  handle.collection('hist').onSnapshot(function(snap){
    S.hist = snap.docs.map(function(d){ var o = JSON.parse(JSON.stringify(d.data())); o.id = d.id; return o; }); sortHist(); purgeHist(); render();
  }, function(){});
  handle.doc('app/config').onSnapshot(function(snap){
    if (cfgPending > 0) return;
    if (snap.exists) { S.cfg = normCfg(snap.data()); }
    S.gotCfg = true; S.ready = S.gotCfg && S.gotTx; render();
  }, function(){ S.gotCfg = true; S.ready = S.gotCfg && S.gotTx; render(); });
  handle.collection('tx').onSnapshot(function(snap){
    S.tx = snap.docs.map(function(d){ var o = JSON.parse(JSON.stringify(d.data())); o.id = d.id; return o; });
    S.gotTx = true; S.ready = S.gotCfg && S.gotTx; render();
  }, function(){ S.gotTx = true; S.ready = S.gotCfg && S.gotTx; render(); });
}
function startLocal(){ db = null; S.mode = 'local'; loadLocal(); loadHistLocal(); S.ready = true; render(); }


/* ---------- requests to Claude are applied at once; every one is kept 48 h in a history ---------- */
var HIST_KEY = 'budget-mziza-hist', HIST_TTL = 48 * 3600 * 1000;
function findBy(list, t){
  t = String(t == null ? '' : t); var n = norm(t);
  return list.find(function(x){ return x.id === t; }) || list.find(function(x){ return norm(x.name) === n; }) ||
    (n.length >= 3 ? list.find(function(x){ var m = norm(x.name); return m.indexOf(n) >= 0 || n.indexOf(m) >= 0; }) : null) || null;
}
var TYPE_FR = {income:'entrée d\'argent', fixed:'charge fixe', variable:'catégorie'};
/* mutates cfg; returns readable lines */
function applyOps(cfg, ops){
  var lines = [];
  var nonVar = function(){ return cfg.items.filter(function(i){ return i.type !== 'variable'; }); };
  var vars = function(){ return cfg.items.filter(function(i){ return i.type === 'variable'; }); };
  (ops || []).forEach(function(op){
    var it, d;
    if (op.op === 'set_amount') {
      it = findBy(nonVar(), op.target);
      if (!it) { lines.push({t:'Introuvable : ' + op.target + ' (ignoré)', miss:true}); return; }
      var old = +it.amount || 0; it.amount = Math.max(0, round2(+op.amount || 0));
      lines.push({t:it.name + ' : ' + eur(old) + ' → ' + eur(it.amount) + ' par mois'});
    } else if (op.op === 'add_item') {
      var type = op.type === 'fixed' ? 'fixed' : op.type === 'variable' ? 'variable' : 'income';
      var o = {id:op.id || ('i-' + uid()), type:type, name:String(op.name || 'Sans nom').slice(0, 60), amount:Math.max(0, round2(+op.amount || 0)), note:''};
      if (type === 'income') o.group = op.group === 'salary' || op.group === 'family' ? op.group : 'other';
      cfg.items.push(o);
      lines.push({t:'Ajout (' + TYPE_FR[type] + ') : ' + o.name + (type === 'variable' ? ' · part ' + o.amount + ' %' : ' · ' + eur(o.amount) + ' par mois')});
    } else if (op.op === 'remove_item') {
      it = findBy(cfg.items, op.target);
      if (!it) { lines.push({t:'Introuvable : ' + op.target + ' (ignoré)', miss:true}); return; }
      cfg.items = cfg.items.filter(function(x){ return x.id !== it.id; });
      lines.push({t:'Suppression : ' + it.name});
    } else if (op.op === 'set_share') {
      it = findBy(vars(), op.target);
      if (!it) { lines.push({t:'Introuvable : ' + op.target + ' (ignoré)', miss:true}); return; }
      var os = +it.amount || 0; it.amount = Math.max(0, round2(+op.amount || 0));
      lines.push({t:it.name + ' : part ' + os + ' % → ' + it.amount + ' %'});
    } else if (op.op === 'set_active') {
      it = findBy(vars(), op.target);
      if (!it) { lines.push({t:'Introuvable : ' + op.target + ' (ignoré)', miss:true}); return; }
      if (op.active === false) it.active = false; else delete it.active;
      lines.push({t:it.name + ' : ' + (op.active === false ? 'décochée' : 'cochée')});
    } else if (op.op === 'set_debt') {
      d = findBy(cfg.debts, op.target);
      if (!d) { lines.push({t:'Introuvable : ' + op.target + ' (ignoré)', miss:true}); return; }
      if (op.monthly != null) { var om = +d.monthly || 0; d.monthly = Math.max(0, round2(+op.monthly || 0)); lines.push({t:d.name + ' : mensualité ' + eur(om) + ' → ' + eur(d.monthly)}); }
      if (op.start != null) { var os2 = +d.start || 0; d.start = Math.max(0, round2(+op.start || 0)); lines.push({t:d.name + ' : montant de départ ' + eur(os2) + ' → ' + eur(d.start)}); }
    } else if (op.op === 'add_debt') {
      d = {id:op.id || ('d-' + uid()), name:String(op.name || 'Dette').slice(0, 60), start:Math.max(0, round2(+op.start || 0)), monthly:Math.max(0, round2(+op.monthly || 0)), from:addMonths(nowMonth(), 1), skipped:[], note:''};
      cfg.debts.push(d);
      lines.push({t:'Nouvelle dette : ' + d.name + ' · ' + eur(d.start) + ', ' + eur(d.monthly) + ' par mois'});
    } else if (op.op === 'remove_debt') {
      d = findBy(cfg.debts, op.target);
      if (!d) { lines.push({t:'Introuvable : ' + op.target + ' (ignoré)', miss:true}); return; }
      cfg.debts = cfg.debts.filter(function(x){ return x.id !== d.id; });
      lines.push({t:'Dette supprimée : ' + d.name});
    }
  });
  return lines;
}
function cleanOps(raw){
  var okOps = {set_amount:1, add_item:1, remove_item:1, set_share:1, set_active:1, set_debt:1, add_debt:1, remove_debt:1};
  return (Array.isArray(raw) ? raw : []).filter(function(o){ return o && okOps[o.op]; }).slice(0, 14).map(function(o){
    var c = {op:o.op};
    ['target','name','type','group'].forEach(function(k){ if (o[k] != null) c[k] = String(o[k]).slice(0, 80); });
    ['amount','monthly','start'].forEach(function(k){ if (o[k] != null && isFinite(+o[k])) c[k] = +o[k]; });
    if (o.active != null) c.active = o.active !== false && o.active !== 'false';
    if (o.op === 'add_item') c.id = 'i-' + uid();
    if (o.op === 'add_debt') c.id = 'd-' + uid();
    return c;
  });
}

function snapCfg(){ return JSON.parse(JSON.stringify({items:S.cfg.items, debts:S.cfg.debts})); }
function saveHistLocal(){ try { localStorage.setItem(HIST_KEY, JSON.stringify(S.hist)); } catch(e){} }
function loadHistLocal(){ try { var a = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); S.hist = Array.isArray(a) ? a : []; } catch(e){ S.hist = []; } purgeHist(); }
function persistHist(e){
  if (!db) { saveHistLocal(); return; }
  db.collection('hist').doc(e.id).set({q:e.q, t:e.t, lines:e.lines, before:e.before, after:e.after, undone:!!e.undone}).catch(function(){});
}
function removeHist(id){
  S.hist = S.hist.filter(function(x){ return x.id !== id; });
  if (!db) saveHistLocal(); else db.collection('hist').doc(id).delete().catch(function(){});
}
function purgeHist(){
  var lim = Date.now() - HIST_TTL;
  S.hist.filter(function(e){ return e.t < lim; }).forEach(function(e){ removeHist(e.id); });
}
function sortHist(){ S.hist.sort(function(a, b){ return a.t - b.t; }); }
function restoreSnap(snap){
  S.cfg.items = JSON.parse(JSON.stringify(snap.items || [])); S.cfg.debts = JSON.parse(JSON.stringify(snap.debts || []));
  persistCfg();
}
function revertTo(e){
  var k = S.hist.indexOf(e); if (k < 0) return;
  restoreSnap(e.before);
  S.hist.forEach(function(x, j){ if (j >= k && !x.undone) { x.undone = true; persistHist(x); } });
  render(); toast('Retour à avant : « ' + e.q.slice(0, 40) + (e.q.length > 40 ? '…' : '') + ' »');
}
function redoTo(e){
  var k = S.hist.indexOf(e); if (k < 0) return;
  restoreSnap(e.after);
  S.hist.forEach(function(x, j){ if (j <= k && x.undone) { x.undone = false; persistHist(x); } });
  render(); toast('Demande rétablie');
}
function ago(t){
  var m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return 'à l\'instant'; if (m < 60) return 'il y a ' + m + ' min';
  var h = Math.round(m / 60); return h < 24 ? 'il y a ' + h + ' h' : 'il y a ' + Math.round(h / 24) + ' j';
}
function histHTML(){
  if (!S.hist.length) return '';
  var rows = S.hist.slice().reverse().map(function(e){
    return '<div class="sit' + (e.undone ? ' undone' : '') + '"><div class="sit-top"><span class="num">' + (S.hist.indexOf(e) + 1) + '</span><span class="sit-q">« ' + esc(e.q) + ' »<small>' + esc(ago(e.t)) + (e.undone ? ' · annulée' : '') + '</small></span></div>' +
      '<ul>' + (e.lines.length ? e.lines.map(function(l){ return '<li' + (l.miss ? ' class="miss"' : '') + '>' + esc(l.t) + '</li>'; }).join('') : '<li class="miss">Aucune modification</li>') + '</ul>' +
      (e.lines.length ? '<div class="sit-acts">' + (e.undone ? '<button class="btn sm" data-action="hist-redo" data-id="' + esc(e.id) + '">Rétablir</button>' : '<button class="btn sm" data-action="hist-undo" data-id="' + esc(e.id) + '">Revenir à avant</button>') + '</div>' : '') + '</div>';
  }).join('');
  return '<section class="card sim"><details' + detailsAttr('hist') + '><summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique (' + S.hist.length + ')</summary><div class="histlist">' + (rows || '<p class="tiny" style="color:var(--muted)">Aucune demande pour le moment. Elles sont gardées 48 h et peuvent être annulées ici.</p>') + '</div></details></section>';
}

/* ---------- computations ---------- */
function nowMonth(){ return monthOf(todayISO()); }
function txMonth(m){ return S.tx.filter(function(t){ return monthOf(t.date) === m; }); }
function realRef(ref, m){ return sum(txMonth(m).filter(function(t){ return t.ref === ref; }), function(t){ return +t.amount || 0; }); }
function itemsOf(type){ return S.cfg.items.filter(function(i){ return i.type === type; }); }
var gOf = function(it){ return it.group === 'salary' || it.group === 'family' ? it.group : 'other'; };
var colorOf = function(idx){ return 'var(--c' + ((idx % 6) + 1) + ')'; };

/* Debts are debited automatically every month from `from`. A month listed in `skipped` was not debited. */
function debtFrom(d){ return d.from || addMonths(monthOf(S.cfg.startDate), 1); }
function payCount(d, upTo){
  var from = debtFrom(d), sk = d.skipped || [], n = 0, guard = 0;
  for (var m = from; m <= upTo && guard < 240; m = addMonths(m, 1), guard++) { if (sk.indexOf(m) < 0) n++; }
  return n;
}
function paidAt(d, m){ return Math.min(Math.max(0, +d.start || 0), round2(payCount(d, m) * (+d.monthly || 0))); }
function dInfo(d){
  var start = Math.max(0, +d.start || 0), mo = Math.max(0, +d.monthly || 0), paid = paidAt(d, nowMonth());
  return {d:d, start:start, mo:mo, paid:paid, rem:Math.max(0, start - paid), pct:start > 0 ? Math.min(1, paid / start) : 0};
}
function endMonthOf(i){
  if (!(i.mo > 0 && i.rem > 0)) return null;
  var from = debtFrom(i.d), now = nowMonth();
  var next = from > now ? from : addMonths(now, 1);
  return addMonths(next, Math.ceil(i.rem / i.mo - 1e-9) - 1);
}
function monthlyDebts(infos){ return sum(infos.filter(function(i){ return i.rem > 0; }), function(i){ return i.mo; }); }
function planIncome(){ return sum(itemsOf('income'), function(i){ return +i.amount || 0; }); }
function planFixed(){ return sum(itemsOf('fixed'), function(i){ return +i.amount || 0; }); }
function isOn(it){ return it.active !== false; }
function dailyBudgets(left){
  var on = itemsOf('variable').filter(isOn), w = sum(on, function(i){ return Math.max(0, +i.amount || 0); }), out = {};
  if (!(left >= 1) || !(w > 0)) return out;
  var total = Math.floor(left), acc = 0, big = null;
  on.forEach(function(it){
    var v = Math.round(total * Math.max(0, +it.amount || 0) / w); out[it.id] = v; acc += v;
    if (!big || (+it.amount || 0) > (+big.amount || 0)) big = it;
  });
  if (big) out[big.id] = Math.max(0, out[big.id] + (total - acc));
  return out;
}
function dailyStats(m, infos){
  var items = itemsOf('variable'), fixedIds = {};
  itemsOf('fixed').forEach(function(i){ fixedIds[i.id] = true; });
  var dayTx = txMonth(m).filter(function(t){ return t.kind === 'expense' && !fixedIds[t.ref]; });
  var rDay = sum(dayTx, function(t){ return +t.amount || 0; });
  var left = planIncome() - planFixed() - monthlyDebts(infos);
  var bud = dailyBudgets(left);
  var env = sum(Object.keys(bud), function(k){ return bud[k]; });
  return {items:items, dayTx:dayTx, rDay:rDay, env:env, left:left, bud:bud, base:env > 0 ? env : Math.max(0, left)};
}

function etaText(infos){
  if (!infos.length) return '';
  var open = infos.filter(function(i){ return i.rem > 0; });
  if (!open.length) return 'Toutes les dettes sont remboursées.';
  var pay = open.filter(function(i){ return i.mo > 0; });
  var none = open.filter(function(i){ return i.mo <= 0; });
  var parts = [];
  if (pay.length) {
    var endAll = maxStr(pay.map(endMonthOf));
    parts.push('Prélèvements automatiques de ' + eur(sum(pay, function(i){ return i.mo; })) + ' par mois. Dernière échéance prévue en ' + monthLabel(endAll) + '.');
  }
  if (none.length) parts.push(eur(sum(none, function(i){ return i.rem; })) + ' sans mensualité définie (' + none.map(function(i){ return i.d.name; }).join(', ') + ').');
  return parts.join(' ');
}

function niceStep(x){
  var p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p;
  var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return n * p;
}
function curveData(infos){
  var ds = S.cfg.debts;
  if (!ds.length) return null;
  var total0 = sum(infos, function(i){ return i.start; });
  if (total0 <= 0) return null;
  var startM = monthOf(S.cfg.startDate || todayISO());
  var nowM = nowMonth();
  var last = nowM < startM ? startM : nowM;
  var ends = infos.map(endMonthOf).filter(Boolean);
  var stop = ends.length ? maxStr(ends.concat([last])) : last;
  var remAt = function(m){ return sum(ds, function(d){ return Math.max(0, (+d.start || 0) - paidAt(d, m)); }); };
  var pts = [{label:'Départ', v:total0}], na = 1, guard = 0;
  for (var m = startM; m <= stop && guard < 96; m = addMonths(m, 1), guard++) {
    pts.push({label:monthShort(m), v:remAt(m), m:m});
    if (m <= last) na = pts.length;
  }
  var step = niceStep(total0 / 4);
  return {pts:pts, na:na, ymax:Math.ceil(total0 / step) * step, step:step, cur:pts[na-1].v};
}

function chartSVG(cd, W){
  var H = 250, L = 56, R = 22, T = 24, B = 36;
  var iw = W - L - R, ih = H - T - B, N = cd.pts.length;
  var x = function(i){ return L + (N <= 1 ? 0 : iw * i / (N - 1)); };
  var y = function(v){ return T + ih * (1 - v / cd.ymax); };
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Courbe de la dette restante : ' + eur(cd.cur) + ' aujourd\'hui, objectif 0 €">';
  for (var v = 0; v <= cd.ymax + 0.001; v += cd.step) {
    out += '<line class="gl" x1="' + L + '" x2="' + (W-R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>' +
      '<text class="ax" x="' + (L-8) + '" y="' + (y(v)+4).toFixed(1) + '" text-anchor="end">' + esc(eur(v)) + '</text>';
  }
  var maxLabels = Math.max(2, Math.floor(iw / 62)), step = Math.max(1, Math.ceil(N / maxLabels));
  for (var i = 0; i < N; i++) {
    var show = (i === N - 1) || (i % step === 0 && (N - 1 - i) >= Math.ceil(step / 2));
    if (show) out += '<text class="ax" x="' + x(i).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="' + (i === 0 ? 'start' : (i === N-1 ? 'end' : 'middle')) + '">' + esc(cd.pts[i].label) + '</text>';
  }
  var line = '', area = '';
  for (var a = 0; a < cd.na; a++) { line += (a ? 'L' : 'M') + x(a).toFixed(1) + ' ' + y(cd.pts[a].v).toFixed(1) + ' '; }
  area = line + 'L' + x(cd.na-1).toFixed(1) + ' ' + y(0).toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';
  out += '<path class="aa" d="' + area + '"/><path class="al" d="' + line + '"/>';
  if (N > cd.na) {
    var pl = 'M' + x(cd.na-1).toFixed(1) + ' ' + y(cd.pts[cd.na-1].v).toFixed(1) + ' ';
    for (var b = cd.na; b < N; b++) pl += 'L' + x(b).toFixed(1) + ' ' + y(cd.pts[b].v).toFixed(1) + ' ';
    out += '<path class="pl" d="' + pl + '"/><circle class="dot-end" cx="' + x(N-1).toFixed(1) + '" cy="' + y(cd.pts[N-1].v).toFixed(1) + '" r="5"/>';
  }
  var seen = {};
  (cd.marks || []).forEach(function(k){
    var n = seen[k.idx] = (seen[k.idx] || 0);
    seen[k.idx]++;
    var r = Math.max(4, 9 - 2.6 * n);
    out += '<circle cx="' + x(k.idx).toFixed(1) + '" cy="' + y(cd.pts[k.idx].v).toFixed(1) + '" r="' + r + '" fill="' + k.color + '" stroke="var(--surface)" stroke-width="2"><title>' + esc(k.name) + ' : ' + esc(monthLabel(cd.pts[k.idx].m)) + '</title></circle>';
  });
  var cx = x(cd.na-1), cy = y(cd.cur);
  out += '<circle class="dot" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="6"/>';
  var left = cx < W / 2;
  out += '<text class="lbl" x="' + (cx + (left ? 10 : -10)).toFixed(1) + '" y="' + (cy - 12).toFixed(1) + '" text-anchor="' + (left ? 'start' : 'end') + '">' + esc(eur(cd.cur)) + '</text>';
  return out + '</svg>';
}

function matchCategory(text){
  var t = ' ' + norm(text).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  var best = null, bestScore = 0;
  itemsOf('variable').filter(isOn).forEach(function(it){
    var score = 0;
    (KW[it.id] || []).forEach(function(k){ if (t.indexOf(' ' + k + ' ') >= 0) score += 2; });
    norm(it.name).split(/[^a-z0-9]+/).forEach(function(w){ if (w.length >= 4 && t.indexOf(' ' + w + ' ') >= 0) score += 2; });
    if (score > bestScore) { best = it; bestScore = score; }
  });
  return best;
}
function parseAmountText(text){
  var re = /(\d+(?:[.,]\d{1,2})?)\s*(€|euros\b|euro\b|eur\b)?/gi, m, first = null, cur = null;
  while ((m = re.exec(text))) {
    var v = parseFloat(m[1].replace(',', '.'));
    if (!(v > 0)) continue;
    if (first === null) first = v;
    if (m[2] && cur === null) cur = v;
  }
  return cur !== null ? cur : first;
}

function resizeImage(file, max){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

    var applied = null, act = S.hist.filter(function(e){ return !e.undone; });
    if (r && r.annuler != null && r.annuler !== false) {
      var n = r.annuler === 'toutes' ? act.length : Math.max(1, Math.min(act.length, parseInt(r.annuler, 10) || 1));
      if (!act.length) { text = 'Il n\'y a aucune demande à annuler.'; }
      else { var target = act[act.length - n]; revertTo(target); S.askAsked = ''; text = ''; return; }
    } else if (ops.length) {
      S.hist.filter(function(e){ return e.undone; }).forEach(function(e){ removeHist(e.id); });
      var before = snapCfg(), lines = applyOps(S.cfg, ops);
      persistCfg();
      var e = {id:'h-' + uid(), q:q, t:Date.now(), lines:lines, before:before, after:snapCfg(), undone:false};
      S.hist.push(e); persistHist(e);
      applied = e;
    }
    if (applied) {
      S.askAsked = ''; S.askOut = '';
      var shown = applied.lines.filter(function(l){ return !l.miss; }).map(function(l){ return l.t; });
      var missed = applied.lines.length - shown.length;
      var ev = applied;
      toast('Fait : ' + (shown.slice(0, 2).join(' · ') || 'aucune modification') + (shown.length > 2 ? ' (+' + (shown.length - 2) + ')' : '') + (missed ? ' · ' + missed + ' élément introuvable' : ''), function(){ revertTo(ev); });
    } else {
      S.askOut = text || 'Je n\'ai rien à modifier pour cette demande.';
    }
  } catch(e) {
    if (e && e.code === 'cancelled') { S.askAsked = ''; }
    else if (e && e.code === 'not_granted') { S.askOut = 'La question n\'a pas pu être envoyée : l\'autorisation de contacter Claude a été refusée.'; }
    else { S.askOut = 'Claude n\'a pas pu répondre pour le moment. Réessayez dans un instant.'; }
  } finally { S.askBusy = false; S.askCtl = null; render(); }
}

/* expense movement */
function moveHTML(){
  var M = S.m;
  var opt = function(v, l){ return '<option value="' + esc(v) + '"' + (M.ref === v ? ' selected' : '') + '>' + esc(l) + '</option>'; };
  var grp = function(label, arr){ return arr.length ? '<optgroup label="' + label + '">' + arr.map(function(i){ return opt(i.id, i.name); }).join('') + '</optgroup>' : ''; };
  var opts = '<option value=""' + (!M.ref ? ' selected' : '') + ' disabled>Choisir…</option>';
  if (M.scope === 'all') opts += grp('Charges fixes', itemsOf('fixed')) + grp('Budget quotidien', itemsOf('variable'));
  else opts += itemsOf('variable').filter(isOn).map(function(i){ return opt(i.id, i.name); }).join('');
  var title = M.title || (M.editId ? 'Modifier la dépense' : 'Nouvelle dépense');
  return '<h2>' + esc(title) + '</h2>' +
    '<form data-form="move" novalidate style="display:flex;flex-direction:column;gap:14px">' +
    '<div class="field"><label for="m-ref">Catégorie</label><select id="m-ref">' + opts + '</select></div>' +
    (M.ref === '__new' ? '<div class="field"><label for="m-name">Nom de la catégorie</label><input id="m-name" maxlength="60" value="' + esc(M.name||'') + '" placeholder="ex. Animaux"></div>' : '') +
    '<div class="field"><label for="m-amount">Montant (€)</label><input id="m-amount" inputmode="decimal" autocomplete="off" value="' + esc(M.amount||'') + '" placeholder="0,00"></div>' +
    '<div class="field"><label for="m-date">Date</label><input id="m-date" type="date" value="' + esc(M.date) + '"></div>' +
    '<div class="field"><label for="m-note">Remarque (facultatif)</label><input id="m-note" maxlength="120" value="' + esc(M.note||'') + '"></div>' +
    '<p class="err" id="m-err" role="alert"></p>' +
    '<div class="foot"><button type="button" class="btn" data-action="close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>';
}
function refreshMove(focusId){
  var sheet = $('#modal .sheet'); if (!sheet) return;
  sheet.innerHTML = moveHTML();
  var f = focusId && sheet.querySelector('#' + focusId); if (f) f.focus();
}
function openMove(ref, tx, scope, pre){
  pre = pre || {};
  var date = defaultDate();
  S.m = tx ? {scope:'all', ref:tx.ref, name:'', amount:fmtIn(tx.amount), date:tx.date, note:tx.note||'', editId:tx.id}
           : {scope:scope || 'var', ref:ref || pre.ref || '', name:'', amount:pre.amount || '', date:pre.date || date, note:pre.note || '', editId:null, title:pre.title};
  showModal(moveHTML(), S.m.ref && S.m.amount ? '#m-note' : (S.m.ref ? '#m-amount' : '#m-ref'));
}
function submitMove(){
  var M = S.m, err = $('#m-err');
  var fail = function(t){ err.textContent = t; };
  var amt = parseAmt(M.amount);
  if (!M.ref) return fail('Choisissez une catégorie.');
  if (M.ref === '__new' && !(M.name||'').trim()) return fail('Indiquez un nom.');
  if (!(amt > 0)) return fail('Indiquez un montant supérieur à 0.');
  if (!M.date) return fail('Indiquez une date.');
  var ref = M.ref, label;
  if (ref === '__new') {
    var it = {id:'i-' + uid(), type:'variable', name:M.name.trim(), amount:0, note:''};
    S.cfg.items.push(it); persistCfg(); ref = it.id; label = it.name;
  } else {
    var i2 = S.cfg.items.find(function(x){ return x.id === ref; }); label = i2 ? i2.name : '';
  }
  var t = {id: M.editId || ('t-' + uid()), date:M.date, kind:'expense', ref:ref, label:label, amount:round2(amt), note:(M.note||'').trim()};
  if (M.editId) { S.tx = S.tx.map(function(x){ return x.id === t.id ? t : x; }); } else { S.tx.push(t); }
  persistTx(t);
  closeModal(); render(); toast('Dépense de ' + eur(t.amount) + ' enregistrée');
}

/* items: income, fixed charge, daily category */
function itemHTML(){
  var I = S.i;
  var titles = {income:'entrée d\'argent', fixed:'charge fixe', variable:'catégorie du quotidien'};
  var amountLabel = I.type === 'variable' ? 'Part du budget (en %)' : 'Montant par mois (€)';
  var grp = '';
  if (I.type === 'income') {
    var go = function(v, l){ return '<option value="' + v + '"' + (I.group === v ? ' selected' : '') + '>' + l + '</option>'; };
    grp = '<div class="field"><label for="i-group">Type d\'entrée</label><select id="i-group" name="group">' + go('salary','Salaire') + go('family','Participation d\'un enfant') + go('other','Aide ou autre entrée') + '</select></div>';
  }
  return '<h2>' + (I.id ? (I.type === 'variable' ? 'Part de la catégorie' : 'Modifier la ligne') : 'Nouvelle ' + titles[I.type]) + '</h2>' +
    '<form data-form="item" novalidate style="display:flex;flex-direction:column;gap:14px">' +
    '<div class="field"><label for="i-name">Nom</label><input id="i-name" name="name" maxlength="60" value="' + esc(I.name) + '"></div>' + grp +
    '<div class="field"><label for="i-amount">' + amountLabel + '</label><input id="i-amount" name="amount" inputmode="decimal" autocomplete="off" value="' + esc(I.amount) + '" placeholder="0"></div>' +
    '<div class="field"><label for="i-note">Remarque (facultatif)</label><input id="i-note" name="note" maxlength="120" value="' + esc(I.note) + '"></div>' +
    '<p class="err" id="i-err" role="alert"></p>' +
    '<div class="foot">' + (I.id ? '<button type="button" class="btn danger" data-action="del-item">Supprimer</button><span class="spacer"></span>' : '') +
    '<button type="button" class="btn" data-action="close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>';
}
function openItem(type, id){
  var it = id ? S.cfg.items.find(function(x){ return x.id === id; }) : null;
  S.i = it ? {id:it.id, type:it.type, name:it.name, amount:fmtIn(it.amount||0), note:it.note||'', group:gOf(it)} : {id:null, type:type, name:'', amount:'', note:'', group:'other'};
  showModal(itemHTML(), '#i-name');
}
function submitItem(form){
  var I = S.i, err = $('#i-err');
  var name = form.elements.name.value.trim(), raw = form.elements.amount.value.trim();
  var amt = raw === '' ? 0 : parseAmt(raw);
  if (!name) { err.textContent = 'Indiquez un nom.'; return; }
  if (!(amt >= 0)) { err.textContent = 'Le montant doit être un nombre positif ou nul.'; return; }
  var note = form.elements.note.value.trim();
  var group = (I.type === 'income' && form.elements.group) ? form.elements.group.value : null;
  var build = function(id, type){ var o = {id:id, type:type, name:name, amount:round2(amt), note:note}; if (type === 'income') o.group = group || 'other'; var old = S.cfg.items.find(function(x){ return x.id === id; }); if (type === 'variable' && old && old.active === false) o.active = false; return o; };
  if (I.id) { S.cfg.items = S.cfg.items.map(function(x){ return x.id === I.id ? build(x.id, x.type) : x; }); }
  else { S.cfg.items.push(build('i-' + uid(), I.type)); }
  persistCfg(); closeModal(); render(); toast('Enregistré');
}

/* missed debit */
function skipMonthsFor(d){
  var from = debtFrom(d), now = nowMonth(), sk = d.skipped || [], out = [], guard = 0;
  for (var m = from; m <= now && guard < 240; m = addMonths(m, 1), guard++) { if (sk.indexOf(m) < 0) out.push(m); }
  return out;
}
function skipHTML(){
  var K = S.sk, ds = S.cfg.debts;
  var d = ds.find(function(x){ return x.id === K.debt; }) || ds[0];
  K.debt = d ? d.id : '';
  var months = d ? skipMonthsFor(d) : [];
  if (!months.length) K.month = ''; else if (months.indexOf(K.month) < 0) K.month = months[months.length - 1];
  var already = [];
  ds.forEach(function(x){ (x.skipped || []).slice().sort().forEach(function(m){ already.push({d:x, m:m}); }); });
  var first = ds.length ? ds.map(debtFrom).reduce(function(a,b){ return a < b ? a : b; }) : nowMonth();
  var anyMonths = ds.some(function(x){ return skipMonthsFor(x).length; });
  var form;
  if (!ds.length) form = '<p class="lead">Aucune dette enregistrée.</p>';
  else if (!anyMonths) form = '<p class="lead">Aucun prélèvement à signaler pour l\'instant : les premiers prélèvements commencent en ' + esc(monthLabel(first)) + '.</p>';
  else {
    form = '<form data-form="skip" novalidate style="display:flex;flex-direction:column;gap:14px">' +
      '<div class="field"><label for="sk-debt">Dette concernée</label><select id="sk-debt">' + ds.map(function(x){ return '<option value="' + esc(x.id) + '"' + (x.id === K.debt ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="sk-month">Mois non prélevé</label>' + (months.length ? '<select id="sk-month">' + months.map(function(m){ return '<option value="' + m + '"' + (m === K.month ? ' selected' : '') + '>' + esc(monthLabel(m)) + '</option>'; }).join('') + '</select>' : '<p class="lead">Aucun mois à signaler pour cette dette.</p>') + '</div>' +
      '<div class="foot"><button type="button" class="btn" data-action="close">Fermer</button>' + (months.length ? '<button type="submit" class="btn primary">Marquer comme non payé</button>' : '') + '</div></form>';
  }
  var list = already.length ? '<div class="sk-list"><h3>Déjà signalés</h3>' + already.map(function(a){
    return '<div class="sk-row"><span>' + esc(a.d.name) + ' · ' + esc(monthLabel(a.m)) + '</span><button class="btn sm ghost" data-action="unskip" data-debt="' + esc(a.d.id) + '" data-month="' + a.m + '">Remettre comme payé</button></div>';
  }).join('') + '</div>' : '';
  return '<h2>Signaler un mois non payé</h2><p class="lead">Le remboursement de ce mois ne compte pas : la dette restante augmente et la date de fin recule d\'un mois.</p>' + form + list +
    (anyMonths && ds.length ? '' : '<div class="foot"><button type="button" class="btn" data-action="close">Fermer</button></div>');
}
function openSkip(){ S.sk = {debt:'', month:''}; showModal(skipHTML()); }
function refreshSkip(){ var sheet = $('#modal .sheet'); if (sheet && S.sk) sheet.innerHTML = skipHTML(); }
function submitSkip(){
  var K = S.sk; if (!K || !K.debt || !K.month) return;
  var d = S.cfg.debts.find(function(x){ return x.id === K.debt; }); if (!d) return;
  d.skipped = (d.skipped || []).concat([K.month]).sort();
  persistCfg(); var name = d.name, mo = K.month; closeModal(); render(); toast(name + ' : ' + monthLabel(mo) + ' marqué comme non payé');
}

function quick(id){
  var m = S.month, date = m === nowMonth() ? todayISO() : m + '-01';
  var it = S.cfg.items.find(function(x){ return x.id === id; }); if (!it) return;
  var left = (+it.amount||0) - realRef(id, m); if (left <= 0) return;
  var t = {id:'t-' + uid(), date:date, kind:'expense', ref:id, label:it.name, amount:round2(left), note:''};
  S.tx.push(t); persistTx(t); render(); toast(eur(t.amount) + ' payé : ' + t.label);
}

/* ---------- events ---------- */
var armedTimer;
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]'); if (!el) return;
  var a = el.dataset.action;
  if (a === 'overlay') { if (e.target === el && !S.scanCtl) closeModal(); return; }
  if (a === 'close') return closeModal();
  if (a === 'tab') { S.tab = S.tab === el.dataset.tab ? null : el.dataset.tab; render(); return; }
  if (a === 'mic') { startMic(); return; }
  if (a === 'hist-undo') { var he = S.hist.find(function(x){ return x.id === el.dataset.id; }); if (he) revertTo(he); return; }
  if (a === 'hist-redo') { var hr = S.hist.find(function(x){ return x.id === el.dataset.id; }); if (hr) redoTo(hr); return; }
  if (a === 'home') { S.tab = null; render(); window.scrollTo({top:0}); return; }
  if (a === 'ask-close') { S.askAsked = ''; S.askOut = ''; render(); return; }
  if (a === 'ask-stop') { if (S.askCtl) S.askCtl.abort(); return; }
  if (a === 'month-prev') { S.month = addMonths(S.month, -1); render(); return; }
  if (a === 'month-next') { S.month = addMonths(S.month, 1); render(); return; }
  if (a === 'month-now') { S.month = nowMonth(); render(); return; }
  if (a === 'open-move') return openMove(el.dataset.ref, null, el.dataset.scope);
  if (a === 'quick') return quick(el.dataset.id);
  if (a === 'add-item') return openItem(el.dataset.type);
  if (a === 'edit-item') return openItem(null, el.dataset.id);
  if (a === 'open-skip') return openSkip();
  if (a === 'scan-pick') { var f = $('#scan-file'); if (f) f.click(); return; }
  if (a === 'scan-cancel') { if (S.scanCtl) S.scanCtl.abort(); closeModal(); return; }
  if (a === 'toast-undo') { var u = S.undo; S.undo = null; $('#toast').hidden = true; if (u) u(); return; }
  if (a === 'unskip') {
    var d = S.cfg.debts.find(function(x){ return x.id === el.dataset.debt; });
    if (d) { d.skipped = (d.skipped || []).filter(function(m){ return m !== el.dataset.month; }); persistCfg(); refreshSkip(); render(); toast('Prélèvement remis comme payé'); }
    return;
  }
  if (a === 'edit-tx') { var t = S.tx.find(function(x){ return x.id === el.dataset.id; }); if (t) openMove(t.ref, t); return; }
  if (a === 'del-tx') {
    var id = el.dataset.id;
    if (S.confirm !== id) { S.confirm = id; render(); clearTimeout(armedTimer); armedTimer = setTimeout(function(){ S.confirm = null; render(); }, 4000); return; }
    S.confirm = null; S.tx = S.tx.filter(function(x){ return x.id !== id; }); removeTx(id); render(); toast('Dépense supprimée'); return;
  }
  if (a === 'del-item') {
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.classList.add('armed'); el.textContent = 'Confirmer la suppression'; return; }
    var iid = S.i.id; S.cfg.items = S.cfg.items.filter(function(x){ return x.id !== iid; });
    persistCfg(); closeModal(); render(); toast('Supprimé'); return;
  }
});
document.addEventListener('toggle', function(e){
  var d = e.target;
  if (d && d.dataset && d.dataset.open) S.open[d.dataset.open] = d.open;
}, true);
document.addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target, k = f.dataset.form;
  if (k === 'move' && S.m) submitMove();
  else if (k === 'item' && S.i) submitItem(f);
  else if (k === 'skip' && S.sk) submitSkip();
  else if (k === 'qa') quickAdd(S.qa);
  else if (k === 'ask') askClaude(S.askQ);
});
document.addEventListener('input', function(e){
  var id = e.target.id;
  if (id === 'qa-text') { S.qa = e.target.value; return; }
  if (id === 'ask-text') { S.askQ = e.target.value; return; }
  if (!S.m) return;
  if (id === 'm-amount') S.m.amount = e.target.value;
  else if (id === 'm-date') S.m.date = e.target.value;
  else if (id === 'm-note') S.m.note = e.target.value;
  else if (id === 'm-name') S.m.name = e.target.value;
});
document.addEventListener('change', function(e){
  var id = e.target.id;
  if (e.target.dataset && e.target.dataset.toggle) {
    var ci = S.cfg.items.find(function(x){ return x.id === e.target.dataset.toggle; });
    if (ci) { if (e.target.checked) delete ci.active; else ci.active = false; persistCfg(); render(); }
    return;
  }
  if (id === 'scan-file') { var file = e.target.files && e.target.files[0]; e.target.value = ''; if (file) handleScan(file); return; }
  if (id === 'm-ref' && S.m) { S.m.ref = e.target.value; refreshMove(S.m.ref === '__new' ? 'm-name' : 'm-amount'); }
  else if (id === 'm-date' && S.m) { S.m.date = e.target.value; }
  else if (id === 'sk-debt' && S.sk) { S.sk.debt = e.target.value; S.sk.month = ''; refreshSkip(); }
  else if (id === 'sk-month' && S.sk) { S.sk.month = e.target.value; }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && $('#modal').firstChild && !S.scanCtl) closeModal(); });
var rzT;
window.addEventListener('resize', function(){
  clearTimeout(rzT);
  rzT = setTimeout(function(){
    var app = $('#app'); if (!S.ready || !app || !S.chartW) return;
    if (Math.abs(Math.round(app.clientWidth - 42) - S.chartW) > 12) render();
  }, 200);
});

/* ---------- boot ---------- */
render();
var claudeApi = window.claude && window.claude.use ? window.claude : null;
if (claudeApi) {
  claudeApi.use('db').then(function(h){ if (h) startDb(h); else startLocal(); }).catch(function(){ startLocal(); });
  claudeApi.use('sample').then(function(fn){
    if (!fn) return;
    S.sample = fn; render();
    if (fn.limits) fn.limits().then(function(l){ S.canScan = !!(l && l.images); render(); }).catch(function(){});
  }).catch(function(){});
} else { startLocal(); }
})();
</script>
